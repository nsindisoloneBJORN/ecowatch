<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracking {{ report.report_id }} - EcoWatch</title>
    
    <!-- Bootstrap, Leaflet & Routing Machine CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
    
    <!-- Custom Tracking Stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style/trackCrew.css') }}">
</head>
<body>

    <div class="track-container" id="mapContainer"
         data-lat="{{ report.latitude if report.latitude else -28.852392 }}"
         data-lng="{{ report.longitude if report.longitude else 31.851507 }}"
         data-report-id="{{ report.report_id }}"
         data-location="{{ report.location }}"
         data-crew="{{ report.assigned_crew or 'Active Unit' }}">
        
        <!-- Header Section -->
        <div class="track-header-bar">
            <h2>Live Routing & Tracking: <strong>{{ report.report_id }}</strong></h2>
            <a href="{{ url_for('adminPortal') }}" class="btn-back">Back</a>
        </div>

        <!-- Info Card -->
        <div class="info-card">
            <p><strong>Issue Type:</strong> {{ report.issue_type }}</p>
            <p><strong>Location:</strong> {{ report.location }}</p>
            <p><strong>Assigned Crew:</strong> 
                <span class="text-success fw-bold">{{ report.assigned_crew if report.assigned_crew else 'Unassigned' }}</span>
            </p>
        </div>

        <!-- Live Map Section -->
        <div id="map"></div>
    </div>

    <!-- Leaflet & Routing Machine JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>
    
    <!-- External Custom JavaScript -->
    <script src="{{ url_for('static', filename='js/trackCrew.js') }}"></script>
</body>
</html>
